<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelCraft Transformer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Minecraft Style Generator</h1>
        <p>上傳照片，將其轉換為像素風格！</p>
        
        <div class="upload-section">
            <input type="file" id="imageInput" accept="image/*">
            <button id="generateBtn">開始生成</button>
        </div>

        <div class="display-grid">
            <div class="card">
                <h3>原始圖片</h3>
                <div id="inputPreview" class="image-box"></div>
            </div>
            <div class="card">
                <h3>Minecraft 風格結果</h3>
                <div id="outputArea" class="image-box">
                    <span class="placeholder">等待生成...</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
